<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Publications | SWARM Laboratory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', sans-serif;
    color: #111;
    background: #fff;
    overflow-x: hidden;
}


/* =========================================================
   HEADER
========================================================= */

header {
    width: 100%;
    height: 90px;

    padding: 0 6%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #fff;

    border-bottom: 1px solid #eee;

    position: relative;
    z-index: 9999;
}

.pnu-name {
    color: #0b4a8b;

    font-size: 20px;
    font-weight: 700;

    letter-spacing: -0.4px;

    white-space: nowrap;
}

nav {
    display: flex;
    align-items: center;

    gap: 48px;
}

nav a {
    position: relative;

    color: #111;

    text-decoration: none;

    font-size: 15px;
    font-weight: 500;

    padding: 10px 0;

    white-space: nowrap;
}

nav a:hover {
    color: #0b4a8b;
}

nav a.active {
    color: #0b4a8b;
    font-weight: 600;
}

nav a.active::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 2px;

    background: #0b4a8b;
}


/* =========================================================
   HERO
========================================================= */

.hero {
    padding: 78px 6% 72px;

    background:
        linear-gradient(
            110deg,
            #ffffff 0%,
            #f4f9fd 52%,
            #e4f1fb 100%
        );

    border-bottom: 1px solid #e5ebef;
}

.hero-inner {
    width: 100%;
    max-width: 1450px;

    margin: 0 auto;
}

.hero h1 {
    color: #111;

    font-size: 52px;
    font-weight: 700;

    letter-spacing: -2px;
}

.hero-line {
    width: 65px;
    height: 4px;

    margin-top: 20px;

    background: #0b4a8b;
}


/* =========================================================
   PUBLICATIONS
========================================================= */

.publications {
    width: 100%;
    max-width: 1450px;

    margin: 0 auto;

    padding: 70px 6% 110px;
}


/* =========================================================
   TABS
========================================================= */

.publication-tabs {
    display: flex;
    align-items: center;

    gap: 8px;

    margin-bottom: 55px;

    overflow-x: auto;

    white-space: nowrap;

    scrollbar-width: none;

    border-bottom: 1px solid #dfe4e8;
}

.publication-tabs::-webkit-scrollbar {
    display: none;
}

.publication-tab {
    position: relative;

    flex: 0 0 auto;

    padding: 14px 18px 16px;

    border: 0;

    background: transparent;

    color: #737c85;

    font-family: 'Inter', sans-serif;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;
}

.publication-tab:hover {
    color: #0b4a8b;
}

.publication-tab.active {
    color: #0b4a8b;
}

.publication-tab.active::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: -1px;

    width: 100%;
    height: 3px;

    background: #0b4a8b;
}


/* =========================================================
   CATEGORY TITLE
========================================================= */

.category-header {
    margin-bottom: 46px;
}

.category-label {
    color: #0b4a8b;

    font-size: 12px;
    font-weight: 700;

    letter-spacing: 1.4px;

    text-transform: uppercase;

    margin-bottom: 10px;
}

.category-title {
    color: #111;

    font-size: 34px;
    font-weight: 700;

    letter-spacing: -1px;
}


/* =========================================================
   YEAR
========================================================= */

.year-section {
    display: grid;

    grid-template-columns: 105px minmax(0, 1fr);

    gap: 35px;

    padding: 0 0 48px;

    margin-bottom: 48px;

    border-bottom: 1px solid #e3e7ea;
}

.year-section:last-child {
    margin-bottom: 0;

    border-bottom: 0;
}

.year-title {
    color: #0b4a8b;

    font-size: 24px;
    font-weight: 700;

    line-height: 1.3;
}

.year-publications {
    min-width: 0;
}


/* =========================================================
   PUBLICATION ITEM
========================================================= */

.publication-item {
    position: relative;

    padding-bottom: 30px;

    margin-bottom: 30px;

    border-bottom: 1px solid #edf0f2;
}

.publication-item:last-child {
    padding-bottom: 0;

    margin-bottom: 0;

    border-bottom: 0;
}


/* =========================================================
   TITLE
========================================================= */

.title-row {
    display: flex;
    align-items: flex-start;

    flex-wrap: wrap;

    gap: 9px;

    margin-bottom: 8px;
}

.paper-title {
    color: #111;

    font-size: 17px;
    font-weight: 700;

    line-height: 1.5;

    letter-spacing: -0.25px;
}

.paper-title a {
    color: inherit;

    text-decoration: none;

    transition: color 0.2s ease;
}

.paper-title a:hover {
    color: #0b4a8b;
}


/* =========================================================
   UNDER REVIEW BADGE
========================================================= */

.review-badge {
    display: inline-flex;
    align-items: center;

    padding: 3px 8px;

    border-radius: 20px;

    background: #edf8f1;

    border: 1px solid #b8dfc5;

    color: #27824a;

    font-size: 10px;
    font-weight: 700;

    line-height: 1.2;

    white-space: nowrap;

    margin-top: 4px;
}


/* =========================================================
   AUTHORS / JOURNAL
========================================================= */

.paper-authors {
    color: #4f5962;

    font-size: 14px;

    line-height: 1.65;

    margin-bottom: 4px;
}

.paper-journal {
    color: #747d85;

    font-size: 14px;

    line-height: 1.65;
}


/* =========================================================
   DOI / ARTICLE
========================================================= */

.paper-links {
    display: flex;
    align-items: center;

    gap: 12px;

    margin-top: 8px;
}

.paper-links a {
    display: inline-flex;
    align-items: center;

    color: #0b4a8b;

    font-size: 12px;
    font-weight: 600;

    line-height: 1.4;

    text-decoration: none;

    border-bottom: 1px solid transparent;

    transition: border-color 0.2s ease;
}

.paper-links a:hover {
    border-bottom-color: #0b4a8b;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-message {
    color: #7b848c;

    font-size: 15px;

    line-height: 1.7;

    padding: 20px 0 60px;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    padding: 32px 6%;

    background: #f6f7f8;

    border-top: 1px solid #e5e8eb;
}

.footer-inner {
    width: 100%;
    max-width: 1450px;

    margin: 0 auto;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 20px;
}

.footer-lab {
    color: #0b4a8b;

    font-size: 14px;
    font-weight: 700;
}

.footer-copy {
    color: #8a929b;

    font-size: 12px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 650px) {

    header {
        height: auto;
        min-height: 104px;

        padding: 17px 20px 12px;

        flex-direction: column;

        align-items: flex-start;
        justify-content: flex-start;

        gap: 11px;
    }

    .pnu-name {
        font-size: 16px;
    }

    nav {
        width: 100%;

        gap: 0;

        overflow-x: auto;
        overflow-y: hidden;

        white-space: nowrap;

        scrollbar-width: none;

        -webkit-overflow-scrolling: touch;
    }

    nav::-webkit-scrollbar {
        display: none;
    }

    nav a {
        flex: 0 0 auto;

        font-size: 12px;

        padding: 5px 0 7px;

        margin-right: 22px;
    }

    nav a:last-child {
        margin-right: 0;
    }


    /* HERO */

    .hero {
        padding: 55px 20px 52px;
    }

    .hero h1 {
        font-size: 40px;

        letter-spacing: -1.5px;
    }

    .hero-line {
        width: 52px;
        height: 3px;

        margin-top: 16px;
    }


    /* PUBLICATIONS */

    .publications {
        padding: 48px 20px 75px;
    }

    .publication-tabs {
        margin-bottom: 42px;
    }

    .publication-tab {
        font-size: 14px;

        padding-left: 13px;
        padding-right: 13px;
    }

    .category-header {
        margin-bottom: 36px;
    }

    .category-title {
        font-size: 27px;
    }

    .year-section {
        display: block;

        padding-bottom: 38px;

        margin-bottom: 38px;
    }

    .year-title {
        font-size: 21px;

        margin-bottom: 24px;
    }

    .publication-item {
        padding-bottom: 25px;

        margin-bottom: 25px;
    }

    .paper-title {
        font-size: 16px;
    }

    .paper-authors,
    .paper-journal {
        font-size: 13px;
    }


    /* FOOTER */

    footer {
        padding: 27px 20px;
    }

    .footer-inner {
        flex-direction: column;

        align-items: flex-start;

        gap: 8px;
    }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media (max-width: 390px) {

    header {
        padding-left: 16px;
        padding-right: 16px;
    }

    nav a {
        font-size: 11.5px;

        margin-right: 17px;
    }

    .hero,
    .publications {
        padding-left: 16px;
        padding-right: 16px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <div class="pnu-name">
        Pusan National University
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="research.html">
            Research
        </a>

        <a href="people.html">
            People
        </a>

        <a href="publications.html" class="active">
            Publications
        </a>

        <a href="contact.html">
            Contact
        </a>

    </nav>

</header>


<!-- =========================================================
     HERO
========================================================= -->

<section class="hero">

    <div class="hero-inner">

        <h1>
            Publications
        </h1>

        <div class="hero-line"></div>

    </div>

</section>


<!-- =========================================================
     PUBLICATIONS
========================================================= -->

<main class="publications">


    <!-- TABS -->

    <div class="publication-tabs">

        <button
            class="publication-tab active"
            data-category="international"
        >
            International Journals
        </button>

        <button
            class="publication-tab"
            data-category="domestic"
        >
            Domestic Journals
        </button>

        <button
            class="publication-tab"
            data-category="conference"
        >
            Conference Proceedings
        </button>

        <button
            class="publication-tab"
            data-category="patents"
        >
            Patents
        </button>

        <button
            class="publication-tab"
            data-category="books"
        >
            Books
        </button>

    </div>


    <!-- DYNAMIC CONTENT -->

    <div id="publication-content"></div>


</main>


<!-- =========================================================
     FOOTER
========================================================= -->

<footer>

    <div class="footer-inner">

        <div class="footer-lab">
            SWARM Laboratory
        </div>

        <div class="footer-copy">
            © 2026 SWARM Laboratory, Pusan National University
        </div>

    </div>

</footer>


<!-- =========================================================
     PUBLICATION DATA
========================================================= -->

<script src="publications/international.js"></script>
<script src="publications/domestic.js"></script>
<script src="publications/conference.js"></script>
<script src="publications/patents.js"></script>
<script src="publications/books.js"></script>


<!-- =========================================================
     RENDERER
========================================================= -->

<script>

const publicationData = {

    international: {
        title: "International Journals",
        label: "Publications",
        data: internationalPublications
    },

    domestic: {
        title: "Domestic Journals",
        label: "Publications",
        data: domesticPublications
    },

    conference: {
        title: "Conference Proceedings",
        label: "Publications",
        data: conferencePublications
    },

    patents: {
        title: "Patents",
        label: "Patents",
        data: patentPublications
    },

    books: {
        title: "Books",
        label: "Book Chapters",
        data: bookPublications
    }

};


/* =========================================================
   CREATE PUBLICATION ITEM
========================================================= */

function createPublicationItem(p) {

    const item = document.createElement("div");
    item.className = "publication-item";


    /* -----------------------------------------------------
       TITLE ROW
    ----------------------------------------------------- */

    const titleRow = document.createElement("div");
    titleRow.className = "title-row";


    const title = document.createElement("div");
    title.className = "paper-title";


    /*
       DOI가 있으면 제목 → DOI
       DOI가 없고 URL이 있으면 제목 → URL
       둘 다 없으면 일반 텍스트
    */

    if (p.doi) {

        const titleLink = document.createElement("a");

        titleLink.href = "https://doi.org/" + p.doi;
        titleLink.target = "_blank";
        titleLink.rel = "noopener noreferrer";

        titleLink.textContent = p.title || "";

        title.appendChild(titleLink);

    } else if (p.url) {

        const titleLink = document.createElement("a");

        titleLink.href = p.url;
        titleLink.target = "_blank";
        titleLink.rel = "noopener noreferrer";

        titleLink.textContent = p.title || "";

        title.appendChild(titleLink);

    } else {

        title.textContent = p.title || "";

    }


    titleRow.appendChild(title);


    /* -----------------------------------------------------
       UNDER REVIEW
    ----------------------------------------------------- */

    if (p.underReview) {

        const badge = document.createElement("span");

        badge.className = "review-badge";

        badge.textContent = "Under Review";

        titleRow.appendChild(badge);

    }


    item.appendChild(titleRow);


    /* -----------------------------------------------------
       AUTHORS
    ----------------------------------------------------- */

    if (p.authors) {

        const authors = document.createElement("div");

        authors.className = "paper-authors";

        authors.textContent = p.authors;

        item.appendChild(authors);

    }


    /* -----------------------------------------------------
       JOURNAL / INFORMATION
    ----------------------------------------------------- */

    if (p.journal) {

        const journal = document.createElement("div");

        journal.className = "paper-journal";

        journal.textContent = p.journal;

        item.appendChild(journal);

    }


    /*
       특허/책 데이터에서 journal 대신
       다른 정보 필드를 사용하는 경우를 위한 처리
    */

    if (!p.journal && p.info) {

        const info = document.createElement("div");

        info.className = "paper-journal";

        info.textContent = p.info;

        item.appendChild(info);

    }


    /* -----------------------------------------------------
       DOI / ARTICLE LINK
    ----------------------------------------------------- */

    if (p.doi || p.url) {

        const links = document.createElement("div");

        links.className = "paper-links";


        const link = document.createElement("a");


        if (p.doi) {

            link.href = "https://doi.org/" + p.doi;

            link.textContent = "DOI";

        } else {

            link.href = p.url;

            link.textContent = "Article";

        }


        link.target = "_blank";
        link.rel = "noopener noreferrer";


        links.appendChild(link);

        item.appendChild(links);

    }


    return item;
}


/* =========================================================
   RENDER PUBLICATIONS
========================================================= */

function renderPublications(category) {

    const content = document.getElementById("publication-content");

    content.innerHTML = "";


    const categoryInfo = publicationData[category];

    if (!categoryInfo) {
        return;
    }


    /* -----------------------------------------------------
       CATEGORY HEADER
    ----------------------------------------------------- */

    const categoryHeader = document.createElement("div");

    categoryHeader.className = "category-header";


    const label = document.createElement("div");

    label.className = "category-label";

    label.textContent = categoryInfo.label;


    const title = document.createElement("h2");

    title.className = "category-title";

    title.textContent = categoryInfo.title;


    categoryHeader.appendChild(label);
    categoryHeader.appendChild(title);

    content.appendChild(categoryHeader);


    /* -----------------------------------------------------
       DATA
    ----------------------------------------------------- */

    const data = Array.isArray(categoryInfo.data)
        ? categoryInfo.data
        : [];


    if (data.length === 0) {

        const empty = document.createElement("div");

        empty.className = "empty-message";

        empty.textContent = "No entries are currently available.";

        content.appendChild(empty);

        return;
    }


    /* -----------------------------------------------------
       GROUP BY YEAR
    ----------------------------------------------------- */

    const grouped = {};


    data.forEach((publication) => {

        /*
           year가 없는 데이터도 버리지 않음.
           별도의 Other 그룹으로 표시.
        */

        const year =
            publication.year !== undefined &&
            publication.year !== null &&
            publication.year !== ""
                ? String(publication.year)
                : "Other";


        if (!grouped[year]) {
            grouped[year] = [];
        }


        grouped[year].push(publication);

    });


    /* -----------------------------------------------------
       SORT YEARS
    ----------------------------------------------------- */

    const years = Object.keys(grouped).sort((a, b) => {

        if (a === "Other") {
            return 1;
        }

        if (b === "Other") {
            return -1;
        }

        return Number(b) - Number(a);

    });


    /* -----------------------------------------------------
       YEAR SECTIONS
    ----------------------------------------------------- */

    years.forEach((year) => {

        const yearSection = document.createElement("section");

        yearSection.className = "year-section";


        const yearTitle = document.createElement("div");

        yearTitle.className = "year-title";

        yearTitle.textContent = year;


        const publicationList = document.createElement("div");

        publicationList.className = "year-publications";


        grouped[year].forEach((publication) => {

            publicationList.appendChild(
                createPublicationItem(publication)
            );

        });


        yearSection.appendChild(yearTitle);
        yearSection.appendChild(publicationList);

        content.appendChild(yearSection);

    });

}


/* =========================================================
   TABS
========================================================= */

document
    .querySelectorAll(".publication-tab")
    .forEach((tab) => {

        tab.addEventListener("click", function () {

            document
                .querySelectorAll(".publication-tab")
                .forEach((button) => {

                    button.classList.remove("active");

                });


            this.classList.add("active");


            renderPublications(
                this.dataset.category
            );

        });

    });


/* =========================================================
   DEFAULT
========================================================= */

renderPublications("international");

</script>


</body>

</html>
