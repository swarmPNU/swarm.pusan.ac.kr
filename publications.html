/* ==========================================================
   RENDER PUBLICATIONS
========================================================== */

const publicationList =
  document.getElementById("publication-list");


const years =
  [...new Set(publications.map(p => p.year))]
  .sort((a, b) => b - a);


years.forEach(year => {

  const yearSection =
    document.createElement("section");

  yearSection.className =
    "year-section";


  const yearLabel =
    document.createElement("div");

  yearLabel.className =
    "year-label";

  yearLabel.textContent =
    year;


  const yearPapers =
    document.createElement("div");

  yearPapers.className =
    "year-papers";


  publications
    .filter(p => p.year === year)
    .forEach(paper => {


      const paperElement =
        document.createElement("article");

      paperElement.className =
        "paper";


      /* TITLE */

      const title =
        document.createElement("div");

      title.className =
        "paper-title";

      title.textContent =
        paper.title;


      /* STATUS */

      if (paper.status) {

        const status =
          document.createElement("span");

        status.className =
          "status";

        if (paper.status === "Accepted") {
          status.classList.add("accepted");
        }

        status.textContent =
          paper.status;

        title.appendChild(status);

      }


      /* AUTHORS */

      const authors =
        document.createElement("div");

      authors.className =
        "authors";

      authors.textContent =
        paper.authors;


      /* JOURNAL */

      const journal =
        document.createElement("div");

      journal.className =
        "journal";

      journal.textContent =
        paper.journal;


      /* DOI */

      if (paper.doi) {

        const doi =
          document.createElement("a");

        doi.className =
          "doi-link";

        doi.href =
          "https://doi.org/" + paper.doi;

        doi.target =
          "_blank";

        doi.rel =
          "noopener noreferrer";

        doi.textContent =
          "DOI ↗";

        journal.appendChild(doi);

      }


      paperElement.appendChild(title);
      paperElement.appendChild(authors);
      paperElement.appendChild(journal);

      yearPapers.appendChild(
        paperElement
      );

    });


  yearSection.appendChild(
    yearLabel
  );

  yearSection.appendChild(
    yearPapers
  );

  publicationList.appendChild(
    yearSection
  );

});


</script>
