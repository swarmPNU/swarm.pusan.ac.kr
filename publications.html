<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Publications | SWARM Laboratory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', sans-serif;
    color: #111;
    background: #fff;
    overflow-x: hidden;
}


/* =========================================================
   HEADER
========================================================= */

header {
    width: 100%;
    height: 90px;

    padding: 0 6%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #fff;

    border-bottom: 1px solid #eee;

    position: relative;
    z-index: 9999;
}

.pnu-name {
    color: #0b4a8b;

    font-size: 20px;
    font-weight: 700;

    letter-spacing: -0.4px;

    white-space: nowrap;
}

nav {
    display: flex;
    align-items: center;

    gap: 48px;
}

nav a {
    position: relative;

    color: #111;

    text-decoration: none;

    font-size: 15px;
    font-weight: 500;

    padding: 10px 0;

    white-space: nowrap;
}

nav a:hover {
    color: #0b4a8b;
}

nav a.active {
    color: #0b4a8b;
    font-weight: 600;
}

nav a.active::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 2px;

    background: #0b4a8b;
}


/* =========================================================
   HERO
========================================================= */

.page-hero {
    padding: 76px 6% 70px;

    background:
        linear-gradient(
            115deg,
            #ffffff 0%,
            #f6faff 48%,
            #eaf4fd 100%
        );
}

.hero-inner {
    width: 100%;
    max-width: 1450px;

    margin: 0 auto;
}

.page-hero h1 {
    font-size: clamp(48px, 6vw, 82px);
    font-weight: 800;

    line-height: 1;

    letter-spacing: -4px;
}

.title-line {
    width: 70px;
    height: 4px;

    margin-top: 24px;

    background: #0b4a8b;
}


/* =========================================================
   PUBLICATIONS
========================================================= */

.publications {
    width: 100%;
    max-width: 1450px;

    margin: 0 auto;

    padding: 65px 6% 120px;
}


/* =========================================================
   TABS
========================================================= */

.publication-tabs {
    display: flex;
    align-items: center;

    gap: 34px;

    overflow-x: auto;

    white-space: nowrap;

    padding-bottom: 17px;

    margin-bottom: 50px;

    border-bottom: 1px solid #dfe4e8;

    scrollbar-width: none;
}

.publication-tabs::-webkit-scrollbar {
    display: none;
}

.tab-button {
    position: relative;

    flex: 0 0 auto;

    padding: 0 0 13px;

    border: none;

    background: none;

    color: #727b84;

    font-family: 'Inter', sans-serif;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;

    transition: color 0.2s ease;
}

.tab-button:hover {
    color: #0b4a8b;
}

.tab-button.active {
    color: #0b4a8b;
}

.tab-button.active::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: -18px;

    width: 100%;
    height: 3px;

    background: #0b4a8b;
}


/* =========================================================
   CATEGORY HEADER
========================================================= */

.category-header {
    display: flex;

    align-items: baseline;
    justify-content: space-between;

    gap: 20px;

    margin-bottom: 45px;
}

.category-title {
    color: #111;

    font-size: 31px;
    font-weight: 700;

    letter-spacing: -1px;
}

.category-label {
    color: #9aa1a8;

    font-size: 12px;
    font-weight: 600;

    text-transform: uppercase;

    letter-spacing: 1px;
}


/* =========================================================
   YEAR
========================================================= */

.year-section {
    display: grid;

    grid-template-columns: 105px 1fr;

    gap: 40px;

    padding: 0 0 55px;
}

.year-title {
    color: #0b4a8b;

    font-size: 23px;
    font-weight: 700;

    line-height: 1.2;
}

.year-publications {
    border-top: 1px solid #dfe4e8;
}


/* =========================================================
   PUBLICATION ITEM
========================================================= */

.publication-item {
    padding: 24px 0 25px;

    border-bottom: 1px solid #e2e6e9;
}

.paper-title-row {
    display: flex;

    align-items: center;
    flex-wrap: wrap;

    gap: 9px;

    margin-bottom: 8px;
}

.paper-title {
    color: #111;

    font-size: 17px;
    font-weight: 700;

    line-height: 1.45;

    text-decoration: none;

    letter-spacing: -0.25px;
}

a.paper-title:hover {
    color: #0b4a8b;
}

.paper-authors {
    color: #5f6973;

    font-size: 14px;

    line-height: 1.65;

    margin-bottom: 4px;
}

.paper-journal {
    color: #7a838c;

    font-size: 14px;

    line-height: 1.6;
}


/* =========================================================
   DOI / ARTICLE
========================================================= */

.paper-links {
    display: flex;

    align-items: center;
    flex-wrap: wrap;

    gap: 12px;

    margin-top: 9px;
}

.paper-link {
    display: inline-block;

    color: #0b4a8b;

    font-size: 12px;
    font-weight: 600;

    text-decoration: none;
}

.paper-link:hover {
    text-decoration: underline;
}


/* =========================================================
   UNDER REVIEW
========================================================= */

.review-badge {
    display: inline-flex;

    align-items: center;

    padding: 3px 8px;

    border-radius: 20px;

    background: #edf8f1;

    border: 1px solid #b8dfc5;

    color: #27824a;

    font-size: 10px;
    font-weight: 700;

    line-height: 1.2;

    white-space: nowrap;
}


/* =========================================================
   EMPTY
========================================================= */

.empty-message {
    padding: 45px 0;

    color: #89929a;

    font-size: 14px;

    border-top: 1px solid #dfe4e8;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    padding: 32px 6%;

    background: #f6f7f8;

    border-top: 1px solid #e8eaed;
}

.footer-inner {
    width: 100%;
    max-width: 1450px;

    margin: auto;

    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 20px;
}

.footer-lab {
    color: #0b4a8b;

    font-size: 14px;
    font-weight: 700;
}

.footer-copy {
    color: #8a929b;

    font-size: 12px;
}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 700px) {

    header {
        height: auto;
        min-height: 104px;

        padding: 17px 20px 12px;

        flex-direction: column;

        align-items: flex-start;
        justify-content: flex-start;

        gap: 11px;
    }

    .pnu-name {
        font-size: 16px;
    }

    nav {
        width: 100%;

        gap: 0;

        overflow-x: auto;
        overflow-y: hidden;

        white-space: nowrap;

        scrollbar-width: none;

        -webkit-overflow-scrolling: touch;
    }

    nav::-webkit-scrollbar {
        display: none;
    }

    nav a {
        flex: 0 0 auto;

        font-size: 12px;

        padding: 5px 0 7px;

        margin-right: 22px;
    }

    nav a:last-child {
        margin-right: 0;
    }


    /* HERO */

    .page-hero {
        padding: 52px 20px 50px;
    }

    .page-hero h1 {
        font-size: 48px;

        letter-spacing: -2.5px;
    }

    .title-line {
        width: 55px;
        height: 3px;

        margin-top: 18px;
    }


    /* PUBLICATIONS */

    .publications {
        padding: 45px 20px 75px;
    }

    .publication-tabs {
        gap: 24px;

        margin-bottom: 38px;
    }

    .tab-button {
        font-size: 14px;
    }

    .category-header {
        margin-bottom: 30px;
    }

    .category-title {
        font-size: 26px;
    }

    .category-label {
        display: none;
    }

    .year-section {
        grid-template-columns: 1fr;

        gap: 15px;

        padding-bottom: 45px;
    }

    .year-title {
        font-size: 20px;
    }

    .publication-item {
        padding: 21px 0;
    }

    .paper-title {
        font-size: 15.5px;
    }

    .paper-authors {
        font-size: 13px;
    }

    .paper-journal {
        font-size: 13px;
    }

    .paper-link {
        font-size: 11.5px;
    }


    /* FOOTER */

    footer {
        padding: 27px 20px;
    }

    .footer-inner {
        flex-direction: column;

        align-items: flex-start;

        gap: 8px;
    }
}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media (max-width: 390px) {

    header {
        padding-left: 16px;
        padding-right: 16px;
    }

    nav a {
        font-size: 11.5px;

        margin-right: 17px;
    }

    .page-hero,
    .publications {
        padding-left: 16px;
        padding-right: 16px;
    }

}

</style>

</head>


<body>


<!-- =========================================================
     HEADER
========================================================= -->

<header>

    <div class="pnu-name">
        Pusan National University
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="research.html">
            Research
        </a>

        <a href="people.html">
            People
        </a>

        <a href="publications.html" class="active">
            Publications
        </a>

        <a href="contact.html">
            Contact
        </a>

    </nav>

</header>


<!-- =========================================================
     HERO
========================================================= -->

<section class="page-hero">

    <div class="hero-inner">

        <h1>
            Publications
        </h1>

        <div class="title-line"></div>

    </div>

</section>


<!-- =========================================================
     PUBLICATIONS
========================================================= -->

<main class="publications">


    <!-- TABS -->

    <div class="publication-tabs">

        <button
            class="tab-button active"
            data-category="international"
            type="button"
        >
            International Journals
        </button>

        <button
            class="tab-button"
            data-category="domestic"
            type="button"
        >
            Domestic Journals
        </button>

        <button
            class="tab-button"
            data-category="conference"
            type="button"
        >
            Conference Proceedings
        </button>

        <button
            class="tab-button"
            data-category="patents"
            type="button"
        >
            Patents
        </button>

        <button
            class="tab-button"
            data-category="books"
            type="button"
        >
            Books
        </button>

    </div>


    <!-- CONTENT -->

    <div id="publication-content"></div>


</main>


<!-- =========================================================
     FOOTER
========================================================= -->

<footer>

    <div class="footer-inner">

        <div class="footer-lab">
            SWARM Laboratory
        </div>

        <div class="footer-copy">
            © 2026 SWARM Laboratory, Pusan National University
        </div>

    </div>

</footer>


<!-- =========================================================
     PUBLICATION DATA
========================================================= -->

<script src="publications/international.js"></script>
<script src="publications/domestic.js"></script>
<script src="publications/conference.js"></script>
<script src="publications/patents.js"></script>
<script src="publications/books.js"></script>


<!-- =========================================================
     PUBLICATION RENDERER
========================================================= -->

<script>

const publicationData = {

    international: {
        title: "International Journals",
        label: "Publications",
        data: internationalPublications
    },

    domestic: {
        title: "Domestic Journals",
        label: "Publications",
        data: domesticPublications
    },

    conference: {
        title: "Conference Proceedings",
        label: "Publications",
        data: conferencePublications
    },

    patents: {
        title: "Patents",
        label: "Patents",
        data: patentPublications
    },

    books: {
        title: "Books",
        label: "Book Chapters",
        data: bookPublications
    }

};


function renderPublications(category) {

    const content = document.getElementById("publication-content");

    const categoryInfo = publicationData[category];

    content.innerHTML = "";


    /* CATEGORY HEADER */

    const categoryHeader = document.createElement("div");

    categoryHeader.className = "category-header";


    const categoryTitle = document.createElement("h2");

    categoryTitle.className = "category-title";

    categoryTitle.textContent = categoryInfo.title;


    const categoryLabel = document.createElement("div");

    categoryLabel.className = "category-label";

    categoryLabel.textContent = categoryInfo.label;


    categoryHeader.appendChild(categoryTitle);
    categoryHeader.appendChild(categoryLabel);

    content.appendChild(categoryHeader);


    /* DATA */

    const data = categoryInfo.data || [];


    if (data.length === 0) {

        const empty = document.createElement("div");

        empty.className = "empty-message";

        empty.textContent = "Content will be updated.";

        content.appendChild(empty);

        return;
    }


    /* GET YEARS */

    const years = [
        ...new Set(
            data
                .map(item => item.year)
                .filter(year => year !== undefined && year !== null && year !== "")
        )
    ];


    years.sort((a, b) => Number(b) - Number(a));


    /* RENDER EACH YEAR */

    years.forEach(year => {

        const yearSection = document.createElement("section");

        yearSection.className = "year-section";


        const yearTitle = document.createElement("div");

        yearTitle.className = "year-title";

        yearTitle.textContent = year;


        const yearPublications = document.createElement("div");

        yearPublications.className = "year-publications";


        const yearItems = data.filter(
            item => String(item.year) === String(year)
        );


        yearItems.forEach(p => {

            const item = document.createElement("article");

            item.className = "publication-item";


            /* TITLE ROW */

            const titleRow = document.createElement("div");

            titleRow.className = "paper-title-row";


            let titleElement;


            if (p.doi) {

                titleElement = document.createElement("a");

                titleElement.href =
                    "https://doi.org/" + p.doi;

                titleElement.target = "_blank";

                titleElement.rel = "noopener noreferrer";

            }

            else if (p.url) {

                titleElement = document.createElement("a");

                titleElement.href = p.url;

                titleElement.target = "_blank";

                titleElement.rel = "noopener noreferrer";

            }

            else {

                titleElement = document.createElement("div");

            }


            titleElement.className = "paper-title";

            titleElement.textContent = p.title;

            titleRow.appendChild(titleElement);


            /* UNDER REVIEW BADGE */

            if (p.underReview) {

                const badge = document.createElement("span");

                badge.className = "review-badge";

                badge.textContent = "Under Review";

                titleRow.appendChild(badge);

            }


            item.appendChild(titleRow);


            /* AUTHORS */

            if (p.authors) {

                const authors = document.createElement("div");

                authors.className = "paper-authors";

                authors.textContent = p.authors;

                item.appendChild(authors);

            }


            /* JOURNAL */

            if (p.journal) {

                const journal = document.createElement("div");

                journal.className = "paper-journal";

                journal.textContent = p.journal;

                item.appendChild(journal);

            }


            /* LINKS */

            if (p.doi || p.url) {

                const links = document.createElement("div");

                links.className = "paper-links";


                if (p.doi) {

                    const doi = document.createElement("a");

                    doi.className = "paper-link";

                    doi.href =
                        "https://doi.org/" + p.doi;

                    doi.target = "_blank";

                    doi.rel = "noopener noreferrer";

                    doi.textContent = "DOI";

                    links.appendChild(doi);

                }


                if (p.url && !p.doi) {

                    const article = document.createElement("a");

                    article.className = "paper-link";

                    article.href = p.url;

                    article.target = "_blank";

                    article.rel = "noopener noreferrer";

                    article.textContent = "Article";

                    links.appendChild(article);

                }


                item.appendChild(links);

            }


            yearPublications.appendChild(item);

        });


        yearSection.appendChild(yearTitle);
        yearSection.appendChild(yearPublications);

        content.appendChild(yearSection);

    });


    /* ITEMS WITHOUT YEAR */

    const noYearItems = data.filter(
        item =>
            item.year === undefined ||
            item.year === null ||
            item.year === ""
    );


    if (noYearItems.length > 0) {

        const yearSection = document.createElement("section");

        yearSection.className = "year-section";


        const yearTitle = document.createElement("div");

        yearTitle.className = "year-title";

        yearTitle.textContent = "";


        const yearPublications = document.createElement("div");

        yearPublications.className = "year-publications";


        noYearItems.forEach(p => {

            const item = document.createElement("article");

            item.className = "publication-item";


            const titleRow = document.createElement("div");

            titleRow.className = "paper-title-row";


            let titleElement;


            if (p.doi) {

                titleElement = document.createElement("a");

                titleElement.href =
                    "https://doi.org/" + p.doi;

                titleElement.target = "_blank";

                titleElement.rel = "noopener noreferrer";

            }

            else if (p.url) {

                titleElement = document.createElement("a");

                titleElement.href = p.url;

                titleElement.target = "_blank";

                titleElement.rel = "noopener noreferrer";

            }

            else {

                titleElement = document.createElement("div");

            }


            titleElement.className = "paper-title";

            titleElement.textContent = p.title;

            titleRow.appendChild(titleElement);


            if (p.underReview) {

                const badge = document.createElement("span");

                badge.className = "review-badge";

                badge.textContent = "Under Review";

                titleRow.appendChild(badge);

            }


            item.appendChild(titleRow);


            if (p.authors) {

                const authors = document.createElement("div");

                authors.className = "paper-authors";

                authors.textContent = p.authors;

                item.appendChild(authors);

            }


            if (p.journal) {

                const journal = document.createElement("div");

                journal.className = "paper-journal";

                journal.textContent = p.journal;

                item.appendChild(journal);

            }


            if (p.doi || p.url) {

                const links = document.createElement("div");

                links.className = "paper-links";


                if (p.doi) {

                    const doi = document.createElement("a");

                    doi.className = "paper-link";

                    doi.href =
                        "https://doi.org/" + p.doi;

                    doi.target = "_blank";

                    doi.rel = "noopener noreferrer";

                    doi.textContent = "DOI";

                    links.appendChild(doi);

                }


                if (p.url && !p.doi) {

                    const article = document.createElement("a");

                    article.className = "paper-link";

                    article.href = p.url;

                    article.target = "_blank";

                    article.rel = "noopener noreferrer";

                    article.textContent = "Article";

                    links.appendChild(article);

                }


                item.appendChild(links);

            }


            yearPublications.appendChild(item);

        });


        yearSection.appendChild(yearTitle);
        yearSection.appendChild(yearPublications);

        content.appendChild(yearSection);

    }

}


/* =========================================================
   TAB EVENTS
========================================================= */

document.querySelectorAll(".tab-button").forEach(button => {

    button.addEventListener("click", function() {

        document
            .querySelectorAll(".tab-button")
            .forEach(tab => tab.classList.remove("active"));

        this.classList.add("active");

        renderPublications(this.dataset.category);

    });

});


/* DEFAULT */

renderPublications("international");

</script>


</body>

</html>
