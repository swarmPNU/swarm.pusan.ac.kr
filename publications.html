.pub-tab {

.pub-tab.active {

}

    bottom: -1px;

    height: 3px;

.publication-heading {

    font-weight: 700;
    letter-spacing: -1px;
}

.publication-count {
    color: #77818d;
    font-size: 13px;
}

/* ================= YEAR ================= */

.year-section {
    display: grid;
    grid-template-columns: 110px 1fr;
    border-bottom: 1px solid #dfe3e7;
}

.year-label {
    padding-top: 28px;
    color: #0b4a8b;
    font-size: 26px;
    font-weight: 800;
}

.year-papers {
    padding-left: 32px;
    border-left: 1px solid #e3e6e9;
}

/* ================= PAPER ================= */

.paper {
    padding: 24px 0;
    border-bottom: 1px solid #eceef0;
}

.paper:last-child {
    border-bottom: none;
}

.paper-title,
.paper-title a {
    color: #111;
    font-size: 16px;
    font-weight: 650;
    line-height: 1.5;
    text-decoration: none;
}

.paper-title a:hover {
    color: #0b4a8b;
}

.authors {
    margin-top: 8px;
    color: #4f5a67;
    font-size: 13px;
    line-height: 1.55;
}

.journal {
    margin-top: 4px;
    color: #7a8491;
    font-size: 13px;
    line-height: 1.55;
}

.doi {
    margin-left: 10px;
    color: #0b4a8b;
    font-size: 11px;
    font-weight: 600;
    text-decoration: none;
}

.doi:hover {
    text-decoration: underline;
}

.empty-message {
    padding: 70px 0;
    text-align: center;
    color: #8b949e;
    font-size: 14px;
}

/* ================= MOBILE ================= */

@media (max-width: 800px) {

    .publication-heading {

    .year-section {

    }

    .year-label {
        padding: 28px 0 5px;
    }

    .year-papers {
        padding-left: 0;
        border-left: none;
    }
}

/* =========================================================
   TAB CLICK
========================================================= */

document.querySelectorAll(".pub-tab").forEach(button => {

    button.addEventListener("click", function() {

        document.querySelectorAll(".pub-tab")
            .forEach(tab => tab.classList.remove("active"));

        this.classList.add("active");

        renderPublications(this.dataset.category);

    });

});


/* =========================================================
   RENDER
========================================================= */

function renderPublications(category) {

    const info = publicationData[category];
    const publications = info.data;

    document.getElementById("category-title").textContent =
        info.title;

    document.getElementById("publication-count").textContent =
        publications.length + " Publications";

    const list =
        document.getElementById("publication-list");

    list.innerHTML = "";


    /* EMPTY CONFERENCE */

    if (publications.length === 0) {

        const empty =
            document.createElement("div");

        empty.className = "empty-message";

        empty.textContent =
            "Conference publications will be added soon.";

        list.appendChild(empty);

        return;
    }


    /* YEAR LIST */

    const years =
        [...new Set(publications.map(p => p.year))]
        .sort((a, b) => b - a);


    years.forEach(year => {

        const section =
            document.createElement("section");

        section.className = "year-section";


        const yearLabel =
            document.createElement("div");

        yearLabel.className = "year-label";
        yearLabel.textContent = year;


        const papers =
            document.createElement("div");

        papers.className = "year-papers";


        publications
            .filter(p => p.year === year)
            .forEach(p => {

                const article =
                    document.createElement("article");

                article.className = "paper";


                /* TITLE */

                const title =
                    document.createElement("div");

                title.className = "paper-title";


                if (p.doi || p.url) {

                    const link =
                        document.createElement("a");

                    link.href =
                        p.doi
                            ? "https://doi.org/" + p.doi
                            : p.url;

                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.textContent = p.title;

                    title.appendChild(link);

                } else {

                    title.textContent = p.title;

                }


                /* AUTHORS */

                const authors =
                    document.createElement("div");

                authors.className = "authors";
                authors.textContent = p.authors;


                /* JOURNAL */

                const journal =
                    document.createElement("div");

                journal.className = "journal";
                journal.textContent = p.journal || "";


                /* DOI */

                if (p.doi) {

                    const doi =
                        document.createElement("a");

                    doi.className = "doi";
                    doi.href =
                        "https://doi.org/" + p.doi;

                    doi.target = "_blank";
                    doi.rel = "noopener noreferrer";

                    doi.textContent =
                        "DOI: " + p.doi;

                    journal.appendChild(doi);

                }


                /* ARTICLE LINK */

                else if (p.url) {

                    const link =
                        document.createElement("a");

                    link.className = "doi";
                    link.href = p.url;
                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.textContent = "Article ↗";

                    journal.appendChild(link);

                }


                article.appendChild(title);
                article.appendChild(authors);

                if (p.journal || p.doi || p.url) {
                    article.appendChild(journal);
                }

                papers.appendChild(article);

            });


        section.appendChild(yearLabel);
        section.appendChild(papers);

        list.appendChild(section);

    });

}
