<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Publications | SWARM Laboratory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    color: #111;
    background: #fff;
}


/* ================= HEADER ================= */

header {
    width: 100%;
    height: 90px;
    padding: 0 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #fff;
    border-bottom: 1px solid #eee;
}

.pnu-name {
    color: #0b4a8b;
    font-size: 20px;
    font-weight: 700;
}

nav {
    display: flex;
    gap: 48px;
}

nav a {
    position: relative;
    color: #111;
    text-decoration: none;
    font-size: 15px;
    font-weight: 500;
    padding: 10px 0;
}

nav a:hover,
nav a.active {
    color: #0b4a8b;
}

nav a.active {
    font-weight: 600;
}

nav a.active::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 2px;
    background: #0b4a8b;
}


/* ================= HERO ================= */

.page-hero {
    padding: 65px 8% 55px;
    background: linear-gradient(
        100deg,
        #ffffff 0%,
        #ffffff 55%,
        #f1f7fd 100%
    );
}

.page-hero h1 {
    font-size: clamp(50px, 5vw, 72px);
    font-weight: 800;
    letter-spacing: -3px;
}

.title-line {
    width: 70px;
    height: 4px;
    margin-top: 20px;
    background: #0b4a8b;
}

.page-hero p {
    margin-top: 18px;
    color: #657181;
    font-size: 16px;
}


/* ================= MAIN ================= */

.publications {
    max-width: 1450px;
    margin: 0 auto;
    padding: 55px 8% 100px;
}


/* ================= TABS ================= */

.publication-tabs {
    display: flex;
    gap: 38px;
    margin-bottom: 52px;
    border-bottom: 1px solid #dfe3e7;
}

.pub-tab {
    position: relative;
    padding: 15px 2px 17px;
    border: none;
    background: transparent;
    color: #7a8491;
    font-family: inherit;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
}

.pub-tab:hover,
.pub-tab.active {
    color: #0b4a8b;
}

.pub-tab.active::after {
    content: "";
    position: absolute;
    left: 0;
    bottom: -1px;
    width: 100%;
    height: 3px;
    background: #0b4a8b;
}


/* ================= HEADING ================= */

.publication-heading {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding-bottom: 15px;
    border-bottom: 2px solid #111;
}

.publication-heading h2 {
    font-size: 31px;
    font-weight: 700;
    letter-spacing: -1px;
}

.publication-count {
    color: #77818d;
    font-size: 14px;
}


/* ================= YEAR ================= */

.year-section {
    display: grid;
    grid-template-columns: 110px 1fr;
    border-bottom: 1px solid #dfe3e7;
}

.year-label {
    padding-top: 29px;
    color: #0b4a8b;
    font-size: 27px;
    font-weight: 800;
}

.year-papers {
    padding-left: 32px;
    border-left: 1px solid #e3e6e9;
}


/* ================= PAPER ================= */

.paper {
    padding: 25px 0;
    border-bottom: 1px solid #eceef0;
}

.paper:last-child {
    border-bottom: none;
}

.title-row {
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 9px;
}

.paper-title,
.paper-title a {
    color: #111;
    font-size: 17px;
    font-weight: 650;
    line-height: 1.55;
    text-decoration: none;
}

.paper-title a:hover {
    color: #0b4a8b;
}

.authors {
    margin-top: 8px;
    color: #4f5a67;
    font-size: 14px;
    line-height: 1.6;
}

.journal {
    margin-top: 5px;
    color: #7a8491;
    font-size: 14px;
    line-height: 1.6;
}


/* ================= DOI ================= */

.doi {
    margin-left: 10px;
    color: #0b4a8b;
    font-size: 12px;
    font-weight: 600;
    text-decoration: none;
}

.doi:hover {
    text-decoration: underline;
}


/* ================= UNDER REVIEW ================= */

.review-badge {
    display: inline-flex;
    align-items: center;

    padding: 3px 8px;

    border-radius: 20px;

    background: #edf8f1;
    border: 1px solid #b8dfc5;

    color: #27824a;

    font-size: 10px;
    font-weight: 700;
    line-height: 1.2;

    white-space: nowrap;
}


/* ================= EMPTY ================= */

.empty-message {
    padding: 70px 0;
    text-align: center;
    color: #8b949e;
    font-size: 15px;
}


/* ================= MOBILE ================= */

@media (max-width: 800px) {

    header {
        height: 80px;
        padding: 0 25px;
    }

    .pnu-name {
        font-size: 17px;
    }

    nav {
        display: none;
    }

    .page-hero {
        padding: 50px 25px 40px;
    }

    .publications {
        padding: 40px 25px 70px;
    }

    .publication-tabs {
        gap: 25px;
        overflow-x: auto;
        margin-bottom: 40px;
    }

    .pub-tab {
        flex: 0 0 auto;
        font-size: 14px;
    }

    .publication-heading {
        flex-direction: column;
        align-items: flex-start;
        gap: 8px;
    }

    .year-section {
        grid-template-columns: 1fr;
    }

    .year-label {
        padding: 28px 0 5px;
    }

    .year-papers {
        padding-left: 0;
        border-left: none;
    }

}

</style>

</head>


<body>


<header>

    <div class="pnu-name">
        Pusan National University
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="index.html#research">Research</a>
        <a href="index.html#people">People</a>
        <a href="publications.html" class="active">Publications</a>
        <a href="index.html#contact">Contact</a>
    </nav>

</header>


<section class="page-hero">

    <h1>Publications</h1>

    <div class="title-line"></div>

</section>


<main class="publications">


    <div class="publication-tabs">

        <button class="pub-tab active" data-category="international">
            International Journals
        </button>

        <button class="pub-tab" data-category="domestic">
            Domestic Journals
        </button>

        <button class="pub-tab" data-category="conference">
            Conference Proceedings
        </button>

        <button class="pub-tab" data-category="patents">
            Patents
        </button>

        <button class="pub-tab" data-category="books">
            Books
        </button>

    </div>


    <div class="publication-heading">

        <h2 id="category-title">
            International Journals
        </h2>

        <div
            id="publication-count"
            class="publication-count">
        </div>

    </div>


    <div id="publication-list"></div>


</main>


<!-- ======================================================
     PUBLICATION DATA FILES
======================================================= -->

<script src="publications/international.js"></script>
<script src="publications/domestic.js"></script>
<script src="publications/conference.js"></script>
<script src="publications/patents.js"></script>
<script src="publications/books.js"></script>


<script>

/* =========================================================
   CATEGORY SETTINGS
========================================================= */

const publicationData = {

    international: {
        title: "International Journals",
        label: "Publications",
        data: internationalPublications
    },

    domestic: {
        title: "Domestic Journals",
        label: "Publications",
        data: domesticPublications
    },

    conference: {
        title: "Conference Proceedings",
        label: "Publications",
        data: conferencePublications
    },

    patents: {
        title: "Patents",
        label: "Patents",
        data: patentPublications
    },

    books: {
        title: "Books",
        label: "Book Chapters",
        data: bookPublications
    }

};


/* =========================================================
   TAB CLICK
========================================================= */

document.querySelectorAll(".pub-tab").forEach(button => {

    button.addEventListener("click", function() {

        document.querySelectorAll(".pub-tab")
            .forEach(tab => tab.classList.remove("active"));

        this.classList.add("active");

        renderPublications(this.dataset.category);

    });

});


/* =========================================================
   RENDER
========================================================= */

function renderPublications(category) {

    const info = publicationData[category];
    const publications = info.data;

    document.getElementById("category-title").textContent =
        info.title;

    document.getElementById("publication-count").textContent =
        publications.length + " " + info.label;

    const list =
        document.getElementById("publication-list");

    list.innerHTML = "";


    /* EMPTY */

    if (publications.length === 0) {

        const empty =
            document.createElement("div");

        empty.className = "empty-message";

        empty.textContent =
            "Conference proceedings will be added later.";

        list.appendChild(empty);

        return;
    }


    /* YEARS */

    const years =
        [...new Set(publications.map(p => p.year))]
        .sort((a, b) => b - a);


    years.forEach(year => {

        const section =
            document.createElement("section");

        section.className = "year-section";


        const yearLabel =
            document.createElement("div");

        yearLabel.className = "year-label";
        yearLabel.textContent = year;


        const papers =
            document.createElement("div");

        papers.className = "year-papers";


        publications
            .filter(p => p.year === year)
            .forEach(p => {

                const article =
                    document.createElement("article");

                article.className = "paper";


                /* TITLE ROW */

                const titleRow =
                    document.createElement("div");

                titleRow.className = "title-row";


                const title =
                    document.createElement("div");

                title.className = "paper-title";


                if (p.doi || p.url) {

                    const link =
                        document.createElement("a");

                    link.href =
                        p.doi
                            ? "https://doi.org/" + p.doi
                            : p.url;

                    link.target = "_blank";
                    link.rel = "noopener noreferrer";
                    link.textContent = p.title;

                    title.appendChild(link);

                }

                else {

                    title.textContent = p.title;

                }


                titleRow.appendChild(title);


                /* UNDER REVIEW */

                if (p.underReview) {

                    const badge =
                        document.createElement("span");

                    badge.className = "review-badge";
                    badge.textContent = "Under Review";

                    titleRow.appendChild(badge);

                }


                article.appendChild(titleRow);


                /* AUTHORS */

                if (p.authors) {

                    const authors =
                        document.createElement("div");

                    authors.className = "authors";
                    authors.textContent = p.authors;

                    article.appendChild(authors);

                }


                /* JOURNAL */

                if (p.journal || p.doi || p.url) {

                    const journal =
                        document.createElement("div");

                    journal.className = "journal";


                    if (p.journal) {

                        journal.appendChild(
                            document.createTextNode(p.journal)
                        );

                    }


                    /* DOI */

                    if (p.doi) {

                        const doi =
                            document.createElement("a");

                        doi.className = "doi";

                        doi.href =
                            "https://doi.org/" + p.doi;

                        doi.target = "_blank";
                        doi.rel = "noopener noreferrer";

                        doi.textContent =
                            "DOI: " + p.doi;

                        journal.appendChild(doi);

                    }


                    /* NORMAL ARTICLE LINK */

                    else if (p.url) {

                        const link =
                            document.createElement("a");

                        link.className = "doi";

                        link.href = p.url;

                        link.target = "_blank";
                        link.rel = "noopener noreferrer";

                        link.textContent = "Article ↗";

                        journal.appendChild(link);

                    }


                    article.appendChild(journal);

                }


                papers.appendChild(article);

            });


        section.appendChild(yearLabel);
        section.appendChild(papers);

        list.appendChild(section);

    });

}


/* =========================================================
   DEFAULT
========================================================= */

renderPublications("international");

</script>


</body>
</html>
