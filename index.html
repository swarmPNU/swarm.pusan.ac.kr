<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SWARM Laboratory | Pusan National University</title>

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>

    /* =========================
       BASIC
    ========================= */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #ffffff;
      color: #000000;
    }


    /* =========================
       HEADER
    ========================= */

    header {
      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 105px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;

      z-index: 100;
    }


    /* PUSAN NATIONAL UNIVERSITY */

    .pnu-name {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.4px;

      color: #0b4a8b;
    }


    /* NAVIGATION */

    nav {
      display: flex;
      align-items: center;

      gap: 52px;
    }

    nav a {
      position: relative;

      color: #111111;
      text-decoration: none;

      font-size: 16px;
      font-weight: 500;

      padding: 10px 0;

      transition: color 0.2s ease;
    }

    nav a:hover {
      color: #0b4a8b;
    }

    nav a.active {
      font-weight: 700;
    }

    nav a.active::after {
      content: "";

      position: absolute;
      left: 0;
      bottom: 0;

      width: 100%;
      height: 3px;

      background: #0b4a8b;
    }


    /* =========================
       HERO
    ========================= */

    .hero {
      position: relative;

      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;

      padding: 105px 6% 60px;
    }


    .hero-content {
      margin-top: 30px;
    }


    /* SWARM */

    .hero h1 {
      font-family: 'Inter', sans-serif;

      font-size: clamp(100px, 12vw, 185px);
      font-weight: 900;

      letter-spacing: -8px;
      line-height: 0.88;

      margin-bottom: 40px;
    }


    /* LAB NAME */

    .hero h2 {
      font-family: 'Inter', sans-serif;

      max-width: 1050px;

      font-size: clamp(30px, 3.1vw, 52px);
      font-weight: 700;

      line-height: 1.16;
      letter-spacing: -1.8px;
    }


    /* =========================
       SCROLL
    ========================= */

    .scroll {
      position: absolute;

      left: 50%;
      bottom: 32px;

      transform: translateX(-50%);

      display: flex;
      flex-direction: column;
      align-items: center;

      gap: 10px;

      font-size: 13px;
      font-weight: 500;

      letter-spacing: 2px;

      color: #222222;
    }


    .arrow {
      width: 15px;
      height: 15px;

      border-right: 2px solid #111111;
      border-bottom: 2px solid #111111;

      transform: rotate(45deg);
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 900px) {

      header {
        height: 85px;
        padding: 0 30px;
      }

      .pnu-name {
        font-size: 15px;
      }

      nav {
        gap: 22px;
      }

      nav a {
        font-size: 14px;
      }


      .hero {
        padding: 85px 30px 50px;
      }


      .hero h1 {
        font-size: 20vw;
        letter-spacing: -5px;

        margin-bottom: 30px;
      }


      .hero h2 {
        font-size: 5.5vw;
        letter-spacing: -1px;
      }

    }


    @media (max-width: 650px) {

      header {
        padding: 0 22px;
      }

      nav {
        display: none;
      }


      .hero {
        padding-left: 22px;
        padding-right: 22px;
      }


      .hero h1 {
        font-size: 21vw;
        letter-spacing: -4px;
      }


      .hero h2 {
        font-size: 7vw;
        line-height: 1.2;
      }


      .scroll {
        bottom: 25px;
      }

    }

  </style>
</head>


<body>


  <!-- =========================
       HEADER
  ========================== -->

  <header>

    <div class="pnu-name">
      Pusan National University
    </div>


    <nav>

      <a href="#home" class="active">
        Home
      </a>

      <a href="#research">
        Research
      </a>

      <a href="#people">
        People
      </a>

      <a href="#publications">
        Publications
      </a>

      <a href="#contact">
        Contact
      </a>

    </nav>

  </header>



  <!-- =========================
       MAIN
  ========================== -->

  <main>


    <!-- HERO -->

    <section class="hero" id="home">

      <div class="hero-content">

        <h1>
          SWARM
        </h1>


        <h2>
          Smart Wireless Antenna,<br>
          Radiation, and Microwave Laboratory
        </h2>

      </div>


      <div class="scroll">

        <span>
          Scroll
        </span>

        <div class="arrow"></div>

      </div>

    </section>


  </main>


</body>
</html>
