<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SWARM Laboratory | Pusan National University</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #fff;
      color: #000;
    }

    /* HEADER */
    header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 105px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 6%;
      z-index: 10;
    }

    .pnu {
      display: flex;
      align-items: center;
      gap: 18px;
      color: #0b4a8b;
    }

    .pnu-logo {
      font-size: 32px;
      font-weight: 900;
      font-style: italic;
      letter-spacing: -3px;
    }

    .divider {
      width: 1px;
      height: 38px;
      background: #0b4a8b;
    }

    nav {
      display: flex;
      align-items: center;
      gap: 52px;
    }

    nav a {
      position: relative;
      color: #111;
      text-decoration: none;
      font-size: 16px;
      font-weight: 500;
      padding: 10px 0;
    }

    nav a.active {
      font-weight: 700;
    }

    nav a.active::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: 0;

      width: 100%;
      height: 3px;

      background: #0b4a8b;
    }

    nav a:hover {
      color: #0b4a8b;
    }

    /* HERO */
    .hero {
      position: relative;
      width: 100%;
      min-height: 100vh;

      display: flex;
      align-items: center;

      padding: 100px 6% 60px;
    }

    .hero-content {
      margin-top: 35px;
    }

    .hero h1 {
      font-size: clamp(100px, 12vw, 185px);
      font-weight: 900;
      letter-spacing: -8px;
      line-height: 0.9;
      margin-bottom: 38px;
    }

    .hero h2 {
      max-width: 1000px;
      font-size: clamp(30px, 3.1vw, 52px);
      font-weight: 700;
      line-height: 1.17;
      letter-spacing: -1.5px;
    }

    /* SCROLL */
    .scroll {
      position: absolute;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 9px;

      font-size: 14px;
      letter-spacing: 2px;
      color: #222;
    }

    .arrow {
      width: 16px;
      height: 16px;

      border-right: 2px solid #111;
      border-bottom: 2px solid #111;

      transform: rotate(45deg);
    }

    /* MOBILE */
    @media (max-width: 900px) {

      header {
        height: 80px;
        padding: 0 25px;
      }

      .pnu-logo {
        font-size: 27px;
      }

      .divider {
        height: 30px;
      }

      nav {
        gap: 20px;
      }

      nav a {
        font-size: 14px;
      }

      .hero {
        padding: 80px 25px 50px;
      }

      .hero h1 {
        font-size: 22vw;
        letter-spacing: -5px;
      }

      .hero h2 {
        font-size: 6vw;
      }
    }

    @media (max-width: 650px) {

      nav {
        display: none;
      }

      .hero h1 {
        font-size: 21vw;
      }

      .hero h2 {
        font-size: 7vw;
      }
    }

  </style>
</head>

<body>

  <header>

    <div class="pnu">
      <div class="pnu-logo">PNU</div>
      <div class="divider"></div>
    </div>

    <nav>
      <a href="#" class="active">Home</a>
      <a href="#research">Research</a>
      <a href="#people">People</a>
      <a href="#publications">Publications</a>
      <a href="#contact">Contact</a>
    </nav>

  </header>


  <main>

    <section class="hero">

      <div class="hero-content">

        <h1>SWARM</h1>

        <h2>
          Smart Wireless Antenna,<br>
          Radiation, and Microwave Laboratory
        </h2>

      </div>

      <div class="scroll">
        <span>Scroll</span>
        <div class="arrow"></div>
      </div>

    </section>

  </main>

</body>
</html>
