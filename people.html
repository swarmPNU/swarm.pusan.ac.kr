<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>People | SWARM Laboratory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', sans-serif;
    color: #111;
    background: #fff;
    overflow-x: hidden;
}

img {
    display: block;
    max-width: 100%;
}


/* =========================================================
   HEADER
========================================================= */

header {
    width: 100%;
    height: 90px;

    padding: 0 6%;

    display: flex;
    align-items: center;
    justify-content: space-between;

    background: #fff;

    border-bottom: 1px solid #eee;

    position: relative;
    z-index: 9999;
}

.pnu-name {
    color: #0b4a8b;

    font-size: 20px;
    font-weight: 700;

    letter-spacing: -0.4px;

    white-space: nowrap;
}

nav {
    display: flex;
    align-items: center;

    gap: 48px;
}

nav a {
    position: relative;

    color: #111;

    text-decoration: none;

    font-size: 15px;
    font-weight: 500;

    padding: 10px 0;

    white-space: nowrap;
}

nav a:hover {
    color: #0b4a8b;
}

nav a.active {
    color: #0b4a8b;

    font-weight: 600;
}

nav a.active::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 2px;

    background: #0b4a8b;
}


/* =========================================================
   HERO
========================================================= */

.page-hero {
    padding: 76px 6% 70px;

    background:
        linear-gradient(
            115deg,
            #ffffff 0%,
            #f6faff 48%,
            #eaf4fd 100%
        );
}

.hero-inner {
    width: 100%;
    max-width: 1450px;

    margin: 0 auto;
}

.page-hero h1 {
    font-size: clamp(48px, 6vw, 82px);
    font-weight: 800;

    letter-spacing: -4px;

    line-height: 1;
}

.title-line {
    width: 70px;
    height: 4px;

    margin-top: 24px;

    background: #0b4a8b;
}


/* =========================================================
   PEOPLE SECTION
========================================================= */

.people-section {
    padding: 60px 6% 110px;
}

.people-container {
    width: 100%;
    max-width: 1450px;

    margin: 0 auto;
}


/* =========================================================
   TABS
========================================================= */

.people-tabs {
    display: flex;
    align-items: center;

    gap: 38px;

    margin-bottom: 60px;

    border-bottom: 1px solid #dfe4e8;
}

.people-tab {
    position: relative;

    padding: 0 0 17px;

    border: 0;
    background: none;

    color: #7b848d;

    font-family: 'Inter', sans-serif;

    font-size: 16px;
    font-weight: 600;

    cursor: pointer;

    white-space: nowrap;
}

.people-tab:hover {
    color: #0b4a8b;
}

.people-tab.active {
    color: #0b4a8b;
}

.people-tab.active::after {
    content: "";

    position: absolute;

    left: 0;
    bottom: -1px;

    width: 100%;
    height: 3px;

    background: #0b4a8b;
}


/* =========================================================
   PROFESSOR
========================================================= */

.professor-card {
    display: grid;

    grid-template-columns: 300px minmax(0, 1fr);

    gap: 55px;

    align-items: start;

    max-width: 1100px;

    padding: 0 0 70px;
}

.professor-photo {
    width: 300px;

    aspect-ratio: 4 / 5;

    overflow: hidden;

    background: #f4f6f8;

    border: 1px solid #e2e6ea;
    border-radius: 4px;
}

.professor-photo img {
    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center top;
}

.professor-info {
    padding-top: 3px;
}

.professor-name {
    color: #111;

    font-size: 36px;
    font-weight: 700;

    letter-spacing: -1.2px;

    margin-bottom: 7px;
}

.professor-position {
    color: #0b4a8b;

    font-size: 15px;
    font-weight: 600;

    margin-bottom: 20px;
}

.professor-affiliation {
    color: #5d6771;

    font-size: 14px;

    line-height: 1.75;

    margin-bottom: 22px;
}

.professor-contact {
    margin-bottom: 30px;
}

.professor-contact-row {
    display: flex;
    align-items: baseline;

    gap: 15px;

    margin-bottom: 8px;
}

.professor-contact-label {
    width: 50px;

    color: #8a949e;

    font-size: 10px;
    font-weight: 700;

    letter-spacing: 0.8px;

    text-transform: uppercase;
}

.professor-contact-value {
    color: #333;

    font-size: 13.5px;
}

.professor-contact-value a {
    color: #0b4a8b;

    text-decoration: none;
}

.professor-contact-value a:hover {
    text-decoration: underline;
}


/* PROFESSOR DETAILS */

.professor-detail {
    padding-top: 22px;

    border-top: 1px solid #e2e6ea;
}

.professor-detail + .professor-detail {
    margin-top: 25px;
}

.detail-title {
    color: #111;

    font-size: 12px;
    font-weight: 700;

    letter-spacing: 0.7px;

    text-transform: uppercase;

    margin-bottom: 13px;
}

.detail-list {
    list-style: none;
}

.detail-list li {
    position: relative;

    color: #555f69;

    font-size: 13.5px;

    line-height: 1.7;

    padding-left: 14px;

    margin-bottom: 5px;
}

.detail-list li::before {
    content: "";

    position: absolute;

    left: 0;
    top: 9px;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #0b4a8b;
}


/* =========================================================
   MEMBERS
========================================================= */

.member-group {
    margin-bottom: 70px;
}

.group-title {
    color: #111;

    font-size: 27px;
    font-weight: 700;

    letter-spacing: -0.7px;

    margin-bottom: 32px;

    padding-bottom: 14px;

    border-bottom: 1px solid #e1e5e9;
}

.member-grid {
    display: grid;

    grid-template-columns: repeat(4, minmax(0, 1fr));

    gap: 48px 34px;
}

.member-card {
    min-width: 0;
}

.student-photo {
    width: 82%;

    aspect-ratio: 4 / 4.8;

    margin-bottom: 18px;

    overflow: hidden;

    background: #f2f4f6;

    border: 1px solid #e2e6ea;
    border-radius: 3px;
}

.student-photo img {
    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center top;
}

.photo-placeholder {
    width: 100%;
    height: 100%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: #a1aab3;

    background: #f2f4f6;

    font-size: 12px;
    font-weight: 500;
}

.member-name {
    color: #111;

    font-size: 19px;
    font-weight: 700;

    letter-spacing: -0.4px;

    margin-bottom: 4px;
}

.degree {
    color: #777f88;

    font-size: 13px;

    margin-bottom: 9px;
}

.member-email {
    display: block;

    width: fit-content;

    color: #0b4a8b;

    font-size: 12.5px;

    line-height: 1.5;

    text-decoration: none;

    margin-bottom: 4px;

    overflow-wrap: anywhere;
}

.member-email:hover {
    text-decoration: underline;
}

.personal-website {
    display: block;

    width: fit-content;

    color: #0b4a8b;

    font-size: 12.5px;
    font-weight: 600;

    line-height: 1.5;

    text-decoration: none;

    margin-bottom: 15px;
}

.personal-website:hover {
    text-decoration: underline;
}

.research-label {
    color: #8b949d;

    font-size: 10.5px;
    font-weight: 700;

    letter-spacing: 0.7px;

    text-transform: uppercase;

    margin-top: 13px;
    margin-bottom: 5px;
}

.research-area {
    max-width: 250px;

    color: #4e5963;

    font-size: 13.5px;

    line-height: 1.6;
}


/* =========================================================
   ALUMNI
========================================================= */

.alumni-list {
    width: 100%;
}

.alumni-card {
    display: grid;

    grid-template-columns: 220px minmax(0, 1fr);

    gap: 38px;

    align-items: start;

    padding: 35px 0;

    border-top: 1px solid #e1e5e9;
}

.alumni-card:last-child {
    border-bottom: 1px solid #e1e5e9;
}

.alumni-photo {
    width: 220px;
    height: 270px;

    overflow: hidden;

    background: #f2f4f6;

    border: 1px solid #e2e6ea;
    border-radius: 3px;
}

.alumni-photo img {
    width: 100%;
    height: 100%;

    object-fit: cover;
    object-position: center top;
}

.alumni-info {
    padding-top: 2px;
}

.alumni-name-row {
    display: flex;

    align-items: baseline;

    flex-wrap: wrap;

    gap: 10px;

    margin-bottom: 7px;
}

.alumni-name {
    color: #111;

    font-size: 23px;
    font-weight: 700;

    letter-spacing: -0.5px;
}

.alumni-degree {
    color: #0b4a8b;

    font-size: 12px;
    font-weight: 600;
}

.alumni-email {
    display: inline-block;

    color: #0b4a8b;

    font-size: 12.5px;

    text-decoration: none;

    margin-bottom: 19px;

    overflow-wrap: anywhere;
}

.alumni-email:hover {
    text-decoration: underline;
}

.history-list {
    list-style: none;
}

.history-list li {
    position: relative;

    color: #4e5963;

    font-size: 13.5px;

    line-height: 1.65;

    padding-left: 15px;

    margin-bottom: 7px;
}

.history-list li::before {
    content: "";

    position: absolute;

    left: 0;
    top: 9px;

    width: 4px;
    height: 4px;

    border-radius: 50%;

    background: #b3bac1;
}

.history-date {
    color: #0b4a8b;

    font-weight: 600;
}

.empty-history {
    color: #969da4;

    font-size: 13px;

    font-style: italic;
}


/* =========================================================
   FOOTER
========================================================= */

footer {
    padding: 32px 6%;

    background: #f6f7f8;

    border-top: 1px solid #e8eaed;
}

.footer-inner {
    width: 100%;
    max-width: 1450px;

    margin: auto;

    display: flex;

    justify-content: space-between;
    align-items: center;

    gap: 20px;
}

.footer-lab {
    color: #0b4a8b;

    font-size: 14px;
    font-weight: 700;
}

.footer-copy {
    color: #8a929b;

    font-size: 12px;
}


/* =========================================================
   TABLET
========================================================= */

@media (max-width: 1100px) {

    .member-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
    }

}


@media (max-width: 850px) {

    header {
        height: 80px;

        padding: 0 30px;
    }

    .pnu-name {
        font-size: 18px;
    }

    nav {
        gap: 22px;
    }

    nav a {
        font-size: 14px;
    }

    .page-hero {
        padding: 65px 30px 60px;
    }

    .people-section {
        padding: 55px 30px 85px;
    }

    .professor-card {
        grid-template-columns: 240px minmax(0, 1fr);

        gap: 40px;
    }

    .professor-photo {
        width: 240px;
    }

    .professor-name {
        font-size: 31px;
    }

    .member-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));

        gap: 42px 25px;
    }

    .student-photo {
        width: 84%;
    }

    .alumni-card {
        grid-template-columns: 180px minmax(0, 1fr);

        gap: 30px;
    }

    .alumni-photo {
        width: 180px;
        height: 220px;
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media (max-width: 650px) {

    header {
        height: auto;
        min-height: 104px;

        padding: 17px 20px 12px;

        flex-direction: column;

        align-items: flex-start;
        justify-content: flex-start;

        gap: 11px;
    }

    .pnu-name {
        font-size: 16px;
    }

    nav {
        width: 100%;

        gap: 0;

        overflow-x: auto;
        overflow-y: hidden;

        white-space: nowrap;

        scrollbar-width: none;

        -webkit-overflow-scrolling: touch;
    }

    nav::-webkit-scrollbar {
        display: none;
    }

    nav a {
        flex: 0 0 auto;

        font-size: 12px;

        padding: 5px 0 7px;

        margin-right: 22px;
    }

    nav a:last-child {
        margin-right: 0;
    }


    .page-hero {
        padding: 52px 20px 50px;
    }

    .page-hero h1 {
        font-size: 48px;

        letter-spacing: -2.5px;
    }

    .title-line {
        width: 55px;
        height: 3px;

        margin-top: 18px;
    }


    .people-section {
        padding: 42px 20px 70px;
    }

    .people-tabs {
        gap: 27px;

        overflow-x: auto;

        margin-bottom: 45px;

        scrollbar-width: none;
    }

    .people-tabs::-webkit-scrollbar {
        display: none;
    }

    .people-tab {
        flex: 0 0 auto;

        font-size: 14px;

        padding-bottom: 14px;
    }


    /* PROFESSOR MOBILE */

    .professor-card {
        display: block;

        padding-bottom: 40px;
    }

    .professor-photo {
        width: min(72%, 270px);

        margin-bottom: 28px;
    }

    .professor-name {
        font-size: 29px;

        margin-bottom: 5px;
    }

    .professor-position {
        font-size: 14px;

        margin-bottom: 17px;
    }

    .professor-affiliation {
        font-size: 13px;

        margin-bottom: 19px;
    }

    .professor-contact-row {
        gap: 10px;
    }

    .professor-contact-label {
        width: 44px;
    }

    .professor-contact-value {
        font-size: 12.5px;
    }

    .detail-list li {
        font-size: 12.5px;
    }


    /* MEMBERS MOBILE */

    .member-group {
        margin-bottom: 55px;
    }

    .group-title {
        font-size: 22px;

        margin-bottom: 25px;
    }

    .member-grid {
        grid-template-columns:
            repeat(2, minmax(0, 1fr));

        gap: 38px 18px;
    }

    .student-photo {
        width: 84%;

        margin-bottom: 14px;
    }

    .member-name {
        font-size: 17px;
    }

    .degree {
        font-size: 12px;
    }

    .member-email {
        font-size: 11.5px;
    }

    .personal-website {
        font-size: 11.5px;

        margin-bottom: 12px;
    }

    .research-label {
        font-size: 9.5px;
    }

    .research-area {
        font-size: 12px;

        line-height: 1.55;
    }


    /* ALUMNI MOBILE */

    .alumni-card {
        grid-template-columns: 120px minmax(0, 1fr);

        gap: 20px;

        padding: 28px 0;
    }

    .alumni-photo {
        width: 120px;
        height: 150px;
    }

    .alumni-name {
        font-size: 19px;
    }

    .alumni-degree {
        font-size: 11px;
    }

    .alumni-email {
        font-size: 11.5px;

        margin-bottom: 13px;
    }

    .history-list li {
        font-size: 11.5px;

        line-height: 1.55;

        padding-left: 12px;

        margin-bottom: 6px;
    }


    footer {
        padding: 27px 20px;
    }

    .footer-inner {
        flex-direction: column;

        align-items: flex-start;

        gap: 8px;
    }

}


/* =========================================================
   VERY SMALL MOBILE
========================================================= */

@media (max-width: 390px) {

    header {
        padding-left: 16px;
        padding-right: 16px;
    }

    nav a {
        font-size: 11.5px;

        margin-right: 17px;
    }

    .page-hero,
    .people-section {
        padding-left: 16px;
        padding-right: 16px;
    }

    .member-grid {
        gap: 32px 14px;
    }

    .alumni-card {
        grid-template-columns: 110px minmax(0, 1fr);

        gap: 16px;
    }

    .alumni-photo {
        width: 110px;
        height: 138px;
    }

}

</style>

</head>

        </a>

    </nav>

</header>

<section class="page-hero">

        </h1>

            >

        </div>

<!-- =========================================================
     DATA
========================================================= -->

<script src="people/professor.js"></script>
<script src="people/students.js"></script>
<script src="people/alumni.js"></script>


<script>

/* =========================================================
   PROFESSOR
========================================================= */

function renderProfessor() {

    const container =
        document.getElementById("people-content");

    container.innerHTML = "";


    professorData.forEach(professor => {

        const card =
            document.createElement("div");

        card.className = "professor-card";


        /* PHOTO */

        const photo =
            document.createElement("div");

        photo.className = "professor-photo";


        if (professor.image) {

            const img =
                document.createElement("img");

            img.src = professor.image;
            img.alt = professor.name;

            photo.appendChild(img);

        } else {

            const placeholder =
                document.createElement("div");

            placeholder.className =
                "photo-placeholder";

            placeholder.textContent =
                "Photo";

            photo.appendChild(placeholder);

        }


        /* INFO */

        const info =
            document.createElement("div");

        info.className =
            "professor-info";


        const name =
            document.createElement("h2");

        name.className =
            "professor-name";

        name.textContent =
            professor.name;


        const position =
            document.createElement("div");

        position.className =
            "professor-position";

        position.textContent =
            professor.position;


        const affiliation =
            document.createElement("div");

        affiliation.className =
            "professor-affiliation";

        affiliation.innerHTML =
            professor.affiliation.join("<br>");


        /* CONTACT */

        const contact =
            document.createElement("div");

        contact.className =
            "professor-contact";


        const emailRow =
            document.createElement("div");

        emailRow.className =
            "professor-contact-row";

        emailRow.innerHTML = `
            <div class="professor-contact-label">
                Email
            </div>

            <div class="professor-contact-value">
                <a href="mailto:${professor.email}">
                    ${professor.email}
                </a>
            </div>
        `;


        const telRow =
            document.createElement("div");

        telRow.className =
            "professor-contact-row";

        const telLink =
            professor.tel.replace(/-/g, "");

        telRow.innerHTML = `
            <div class="professor-contact-label">
                Tel
            </div>

            <div class="professor-contact-value">
                <a href="tel:${telLink}">
                    ${professor.tel}
                </a>
            </div>
        `;


        contact.appendChild(emailRow);
        contact.appendChild(telRow);


        /* EDUCATION */

        const education =
            document.createElement("div");

        education.className =
            "professor-detail";

        education.innerHTML = `
            <div class="detail-title">
                Education
            </div>

            <ul class="detail-list">
                ${professor.education
                    .map(item => `<li>${item}</li>`)
                    .join("")}
            </ul>
        `;


        /* EXPERIENCE */

        const experience =
            document.createElement("div");

        experience.className =
            "professor-detail";

        experience.innerHTML = `
            <div class="detail-title">
                Experience
            </div>

            <ul class="detail-list">
                ${professor.experience
                    .map(item => `<li>${item}</li>`)
                    .join("")}
            </ul>
        `;


        info.appendChild(name);
        info.appendChild(position);
        info.appendChild(affiliation);
        info.appendChild(contact);
        info.appendChild(education);
        info.appendChild(experience);

        card.appendChild(photo);
        card.appendChild(info);

        container.appendChild(card);

    });

}


/* =========================================================
   MEMBERS
========================================================= */

function renderMembers() {

    const container =
        document.getElementById("people-content");

    container.innerHTML = "";


    const groups = [
        "Ph.D. Students",
        "M.S. Students"
    ];


    groups.forEach(groupName => {

        const members =
            studentData.filter(
                student =>
                    student.group === groupName
            );


        if (members.length === 0) {
            return;
        }


        const group =
            document.createElement("section");

        group.className =
            "member-group";


        const title =
            document.createElement("h2");

        title.className =
            "group-title";

        title.textContent =
            groupName;


        const grid =
            document.createElement("div");

        grid.className =
            "member-grid";


        members.forEach(member => {

            const card =
                document.createElement("div");

            card.className =
                "member-card";


            /* PHOTO */

            const photo =
                document.createElement("div");

            photo.className =
                "student-photo";


            if (member.image) {

                const img =
                    document.createElement("img");

                img.src =
                    member.image;

                img.alt =
                    member.name;

                photo.appendChild(img);

            } else {

                const placeholder =
                    document.createElement("div");

                placeholder.className =
                    "photo-placeholder";

                placeholder.textContent =
                    "Photo";

                photo.appendChild(
                    placeholder
                );

            }


            /* NAME */

            const name =
                document.createElement("div");

            name.className =
                "member-name";

            name.textContent =
                member.name;


            /* DEGREE */

            const degree =
                document.createElement("div");

            degree.className =
                "degree";

            degree.textContent =
                member.degree;


            /* EMAIL */

            const email =
                document.createElement("a");

            email.className =
                "member-email";

            email.href =
                `mailto:${member.email}`;

            email.textContent =
                member.email;


            card.appendChild(photo);
            card.appendChild(name);
            card.appendChild(degree);
            card.appendChild(email);


            /* WEBSITE */

            if (member.website) {

                const website =
                    document.createElement("a");

                website.className =
                    "personal-website";

                website.href =
                    member.website;

                website.target =
                    "_blank";

                website.rel =
                    "noopener noreferrer";

                website.textContent =
                    "Personal Website ↗";

                card.appendChild(
                    website
                );

            }


            /* RESEARCH */

            if (member.research) {

                const researchLabel =
                    document.createElement("div");

                researchLabel.className =
                    "research-label";

                researchLabel.textContent =
                    "Research Interests";


                const research =
                    document.createElement("div");

                research.className =
                    "research-area";

                research.textContent =
                    member.research;


                card.appendChild(
                    researchLabel
                );

                card.appendChild(
                    research
                );

            }


            grid.appendChild(card);

        });


        group.appendChild(title);
        group.appendChild(grid);

        container.appendChild(group);

    });

}


/* =========================================================
   ALUMNI
========================================================= */

function renderAlumni() {

    const container =
        document.getElementById("people-content");

    container.innerHTML = "";


    const list =
        document.createElement("div");

    list.className =
        "alumni-list";


    alumniData.forEach(alumni => {

        const card =
            document.createElement("div");

        card.className =
            "alumni-card";


        /* PHOTO */

        const photo =
            document.createElement("div");

        photo.className =
            "alumni-photo";


        if (alumni.image) {

            const img =
                document.createElement("img");

            img.src =
                alumni.image;

            img.alt =
                alumni.name;

            photo.appendChild(img);

        } else {

            const placeholder =
                document.createElement("div");

            placeholder.className =
                "photo-placeholder";

            placeholder.textContent =
                "Photo";

            photo.appendChild(
                placeholder
            );

        }


        /* INFO */

        const info =
            document.createElement("div");

        info.className =
            "alumni-info";


        const nameRow =
            document.createElement("div");

        nameRow.className =
            "alumni-name-row";


        const name =
            document.createElement("div");

        name.className =
            "alumni-name";

        name.textContent =
            alumni.name;


        nameRow.appendChild(name);


        if (alumni.degree) {

            const degree =
                document.createElement("div");

            degree.className =
                "alumni-degree";

            degree.textContent =
                alumni.degree;

            nameRow.appendChild(
                degree
            );

        }


        info.appendChild(nameRow);


        /* EMAIL */

        if (alumni.email) {

            const email =
                document.createElement("a");

            email.className =
                "alumni-email";

            email.href =
                `mailto:${alumni.email}`;

            email.textContent =
                alumni.email;

            info.appendChild(email);

        }


        /* HISTORY */

        if (
            alumni.history &&
            alumni.history.length > 0
        ) {

            const historyList =
                document.createElement("ul");

            historyList.className =
                "history-list";


            alumni.history.forEach(item => {

                const li =
                    document.createElement("li");


                const dateMatch =
                    item.match(
                        /^((?:\d{4}\.\s*\d{1,2}\.?|\d{4})(?:\s*[–-]\s*(?:\d{4}\.?\s*\d{0,2}\.?|Present))?)\s*/
                    );


                if (dateMatch) {

                    const date =
                        dateMatch[1];

                    const rest =
                        item.slice(
                            dateMatch[0].length
                        );


                    const dateSpan =
                        document.createElement("span");

                    dateSpan.className =
                        "history-date";

                    dateSpan.textContent =
                        date;


                    li.appendChild(
                        dateSpan
                    );

                    li.appendChild(
                        document.createTextNode(
                            " " + rest
                        )
                    );

                } else {

                    li.textContent =
                        item;

                }


                historyList.appendChild(
                    li
                );

            });


            info.appendChild(
                historyList
            );

        } else {

            const empty =
                document.createElement("div");

            empty.className =
                "empty-history";

            empty.textContent =
                "Additional information will be updated.";

            info.appendChild(empty);

        }


        card.appendChild(photo);
        card.appendChild(info);

        list.appendChild(card);

    });


    container.appendChild(list);

}


/* =========================================================
   TAB CONTROL
========================================================= */

const tabs =
    document.querySelectorAll(
        ".people-tab"
    );


tabs.forEach(tab => {

    tab.addEventListener(
        "click",
        function() {

            tabs.forEach(item =>
                item.classList.remove(
                    "active"
                )
            );


            this.classList.add(
                "active"
            );


            const category =
                this.dataset.category;


            if (
                category ===
                "professor"
            ) {

                renderProfessor();

            }


            if (
                category ===
                "members"
            ) {

                renderMembers();

            }


            if (
                category ===
                "alumni"
            ) {

                renderAlumni();

            }

        }
    );

});


/* DEFAULT */

renderProfessor();
